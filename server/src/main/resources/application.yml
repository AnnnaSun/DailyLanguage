spring:
  application:
    name: daily-language-server
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:daily_language}
    username: ${DATABASE_USER:daily_language}
    password: ${DATABASE_PASSWORD:daily_language_local}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    timeout: 24h
    data:
      redis:
        namespace: daily-language:session:v1
        repository-type: default

app:
  security:
    password-hashing:
      max-concurrent: ${PASSWORD_HASH_MAX_CONCURRENT:1}
    login-rate-limit:
      window: ${LOGIN_RATE_LIMIT_WINDOW:5m}
      max-attempts-per-client-address: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_CLIENT_ADDRESS:20}
      max-attempts-per-email: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_EMAIL:5}
      key-prefix: daily-language:auth-login-rate-limit:v1

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.dailylanguage.persistence
  check-config-location: true
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    enable-sql-runner: false
