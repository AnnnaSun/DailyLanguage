app:
  model-gateway:
    text-generation:
      open-ai-compatible-provider:
        provider-id: ${MODEL_GATEWAY_PROVIDER_ID:deepseek}
        chat-completions-endpoint: ${MODEL_GATEWAY_CHAT_COMPLETIONS_ENDPOINT:https://api.deepseek.com/chat/completions}
      routes:
        conversation:
          model-id: ${MODEL_GATEWAY_CONVERSATION_MODEL_ID:deepseek-chat}
          execution-timeout: ${MODEL_GATEWAY_CONVERSATION_EXECUTION_TIMEOUT:30s}
      executor:
        workers: ${MODEL_GATEWAY_TEXT_EXECUTOR_WORKERS:4}
        queue-capacity: ${MODEL_GATEWAY_TEXT_EXECUTOR_QUEUE_CAPACITY:16}
