spring:
  application:
    name: identity-service
  datasource:
    # 必须显式指定独立身份库，不回退到旧 Language 数据库或旧账号。
    url: ${IDENTITY_DATABASE_URL}
    username: ${IDENTITY_DATABASE_USER}
    password: ${IDENTITY_DATABASE_PASSWORD}
    hikari:
      connection-timeout: 3000
  flyway:
    clean-disabled: true
  data:
    redis:
      # 独立配置 Identity 的 Redis，不沿用旧 Language 的默认地址或凭据。
      host: ${IDENTITY_REDIS_HOST}
      port: ${IDENTITY_REDIS_PORT:55442}
      connect-timeout: 1s
      timeout: 1s
  session:
    timeout: 24h
    data:
      redis:
        namespace: daily-language:identity:session:v1
        repository-type: default

app:
  security:
    password-hashing:
      # 散列和校验共享进程容量；增加容量前需要按实际运行资源验证。
      max-concurrent: ${IDENTITY_PASSWORD_HASH_MAX_CONCURRENT:1}

server:
  address: 127.0.0.1
  port: ${IDENTITY_HTTP_PORT:8081}
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${IDENTITY_SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-handlers-package: com.dailylanguage.identity.persistence
  configuration:
    default-statement-timeout: 5
  global-config:
    enable-sql-runner: false
